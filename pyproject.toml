[project]
name = "gentoogram-bot"
description = "Anti-spam bot for https://t.me/Gentoogram"
authors = [{ name = "Lee Watson", email = "me@lwatson.dev" }]
version = "0.10.1"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14,<3.15"
dependencies = [
    "dynaconf>=3.2.13",
    "niquests[speedups]>=3.19.1",
    "python-telegram-bot[webhooks]>=22.8",
    "sentry-sdk>=2.63.0",
]

[dependency-groups]
dev = [
    "hadolint-py>=2.14.0.1",
    "prek>=0.4.5",
    "ruff>=0.15.18",
    "shellcheck-py>=0.11.0.1",
    "yamllint>=1.38.0",
]

[tool.ruff]
force-exclude = true
extend-exclude = ["docker/data/", "docker/config/"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "DTZ",
    "E",
    "ERA",
    "F",
    "FBT",
    "FIX",
    "FLY",
    "FURB",
    "G010",
    "G101",
    "G201",
    "G202",
    "I",
    "ICN",
    "INP",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TC",
    "TD",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]

# ruff format compatibility
ignore = [
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "E501",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "W191",
]
